name: verify-module2

# Container verification of Module 2 (MOFA2 / SNF integration).
#
# Why this exists: MOFA2 needs a Python backend (mofapy2 via reticulate), so it
# cannot run on the dev machine. Locally the MOFA-dependent testthat tests SKIP
# through `skip_if_no_mofapy2()` — by design, but it means the MOFA code path is
# unexecuted until it runs here. This workflow closes that gap twice over:
#
#   1. FIXTURE LEVEL — runs the whole testthat suite with mofapy2 present, so the
#      MOFA skips lift and those tests actually execute.
#   2. REAL-DATA LEVEL — HEAVY_PULL=true tar_make() over Modules 1 and 2, then
#      reports the actual integration output (variance explained per view,
#      subtype sizes, MOFA-vs-SNF ARI, factor-vs-BAP1/PBRM1 association).
#
# Manual dispatch, or push the dedicated `run-module2` branch. Expect 30-90 min.

on:
  workflow_dispatch:
  push:
    branches: [run-module2]

jobs:
  module2:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_23
    defaults:
      run:
        shell: bash
    env:
      HEAVY_PULL: "true"
      RETICULATE_PYTHON: /usr/bin/python3
      BASILISK_EXTERNAL_DIR: /opt/basilisk
      BASILISK_USE_SYSTEM_DIR: "1"
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      R_PROFILE_USER: /dev/null
      EXPERIMENT_HUB_CACHE: /__w/experimenthub
      ANNOTATION_HUB_CACHE: /__w/annotationhub

    steps:
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Report runner resources
        run: |
          echo "--- disk ---"; df -h /__w / || true
          echo "--- memory ---"; free -h || true
          echo "--- cpus ---"; nproc || true

      # --ignore-installed: the Bioconductor base ships Debian-managed
      # numpy/scipy with no RECORD file, which pip cannot uninstall.
      #
      # scikit-learn is NOT optional here. LEVEL 2 runs a bare `tar_make()`,
      # which now includes Module 4's `bap1_auroc` -- it sources
      # python/bap1_classifier.py through reticulate and imports sklearn. Only
      # validate-container.yml installed it (line 49-50) and that job runs no
      # tar_make, so before this line NO committed workflow both installed
      # sklearn AND built the target: `bap1_auroc` had no execution path
      # anywhere. Pin matches requirements.txt / ci.yml so the container and CI
      # score the classifier with the same solver.
      - name: Install mofapy2 + scikit-learn into the reticulate Python
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y --no-install-recommends python3-dev
          pip3 install --no-cache-dir --break-system-packages --ignore-installed \
            mofapy2==0.7.2 numpy==1.26.4 pandas==2.2.2 h5py==3.11.0 scipy==1.13.1 \
            scikit-learn==1.5.1
          mkdir -p /opt/basilisk
          python3 -c "import mofapy2; print('mofapy2', mofapy2.__version__)"
          python3 -c "import sklearn; print('scikit-learn', sklearn.__version__)"

      - name: Install R dependencies
        run: |
          set -euxo pipefail
          R -q -e '
            # glmnet / randomForestSRC / survival are Module 4s fitters. They
            # are needed TWICE here: LEVEL 1 runs the whole testthat suite and
            # five test-survival.R tests call them with no skip guard, and
            # LEVEL 2s unrestricted tar_make() builds cox_fit /
            # penalised_cox_fit / rsf_fit, which declare them per-target.
            # Omitting them made LEVEL 1 quit non-zero, so the job never
            # reached the real-data build or the credibility anchors -- i.e.
            # adding Phase 4 silently disabled this workflow.
            pkgs <- c("targets", "tarchetypes", "MultiAssayExperiment",
                      "SummarizedExperiment", "RaggedExperiment",
                      "curatedTCGAData", "MOFA2", "SNFtool", "mclust",
                      "glmnet", "randomForestSRC", "survival",
                      "minfi", "IlluminaHumanMethylation450kanno.ilmn12.hg19",
                      "reticulate", "testthat", "lintr", "yaml")
            BiocManager::install(pkgs, update = FALSE, ask = FALSE, Ncpus = 4)
            missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("failed to install: ", paste(missing, collapse = ", "))
            cat("all", length(pkgs), "packages installed\n")
          '

      # LEVEL 1 — the MOFA tests that SKIP on the dev machine must now RUN.
      # A remaining MOFA skip here would mean the guard is misfiring and the
      # code path is still unexecuted, so assert the MOFA skip count is zero.
      #
      # SCOPE: the zero-skip gate covers the mofapy2 guard ONLY. Module 3's
      # credibility anchors (test names prefixed "ANCHOR:") read the frozen
      # `sanity_results` target, and at this point in the job the checkout
      # carries no `_targets/meta` — the store is a release asset and the
      # LEVEL 2 `tar_make` has not run yet — so those tests NECESSARILY skip
      # here. A blanket `sum(df$skipped) > 0` therefore aborted the whole job
      # before the real-data build, with a message blaming MOFA for a Module 3
      # skip (MEASURED on the dev machine, 2026-08-05: 21 skips = 2 mofapy2 +
      # 19 anchors, the anchors being 14 in test-sanity.R and 5 in
      # test-clinical.R). Counts move as anchors are added; the GATE is what
      # matters — non-anchor skips only.
      # The anchors are re-run after `tar_make` below, where they must EXECUTE.
      - name: Full testthat suite with mofapy2 present (MOFA skips must lift)
        run: |
          R -q -e '
            stopifnot(reticulate::py_module_available("mofapy2"))
            cat("### mofapy2 visible to reticulate -> MOFA tests will NOT skip\n")
            res <- testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE)
            df  <- as.data.frame(res)
            anchor <- grepl("^ANCHOR:", df$test)
            cat("\n### SUITE TOTALS\n")
            cat("passed :", sum(df$passed), "\n")
            cat("failed :", sum(df$failed), "\n")
            cat("skipped:", sum(df$skipped),
                " (of which Module 3 anchors:", sum(df$skipped[anchor]), ")\n")
            if (sum(df$skipped[anchor]) > 0) {
              cat("\n### Module 3 anchors skipped — EXPECTED at LEVEL 1 (no _targets store yet).\n")
              cat("### They are asserted after tar_make, where they must execute.\n")
            }
            if (sum(df$skipped[!anchor]) > 0) {
              cat("\n### STILL-SKIPPED TESTS (investigate — the MOFA guard should have lifted)\n")
              print(df[!anchor & df$skipped > 0, c("file", "test")])
            }
            if (sum(df$failed) > 0) quit(status = 1)
            if (sum(df$skipped[!anchor]) > 0) stop("MOFA tests still skipped with mofapy2 present")
          '

      # LEVEL 2 — real data. Continue on error so the artifacts and the level-1
      # result survive an OOM in MOFA training.
      - name: Build Modules 1+2 on the real snapshot
        id: tarmake
        continue-on-error: true
        run: |
          R -q -e '
            t0 <- Sys.time()
            targets::tar_make()
            cat("\n### tar_make wall time:",
                round(difftime(Sys.time(), t0, units = "mins"), 1), "min\n")
            cat("\n### BUILT TARGETS\n"); print(targets::tar_objects())
          '

      # `continue-on-error` above protects the artifacts from an OOM in MOFA
      # training — it is NOT a licence for a target to fail silently. Without
      # this gate any Module-4 target could error (reticulate or scikit-learn
      # absent, a zero-event join, a degenerate design, an EPV throw) and the
      # run would stay green with nothing recording it. `tar_meta` is read
      # rather than the step's outcome so the message names the target and
      # carries its error text.
      - name: Fail if any target errored during the real-data build
        run: |
          R -q -e '
            meta <- targets::tar_meta(fields = c("error", "warnings"))
            bad <- meta[!is.na(meta$error), c("name", "error")]
            if (nrow(bad) > 0) {
              cat("### TARGETS THAT ERRORED\n"); print(bad, right = FALSE)
              quit(status = 1)
            }
            cat("### no target recorded an error across", nrow(meta), "targets\n")
          '

      - name: Report real integration results
        continue-on-error: true
        run: |
          R -q -e '
            source("R/constants.R")
            dir.create("artifacts", showWarnings = FALSE)
            out <- file("artifacts/module2_results.txt", open = "wt")
            emit <- function(...) { cat(..., "\n"); cat(..., "\n", file = out) }

            emit("### COHORT")
            emit("cohort_n =", targets::tar_read(cohort_n))

            # How much missingness is actually in the views? This decides whether
            # SNF (which needs complete features) is still comparing like with
            # like against MOFA (which models missingness natively).
            emit("")
            emit("### MISSINGNESS PER VIEW (drives the SNF complete-feature drop)")
            for (nm in c("rna_mat", "methyl_mat", "cnv_mat")) {
              m <- targets::tar_read_raw(nm)
              ok <- apply(is.finite(m), 1L, all)
              emit(sprintf("%-11s %d x %d | complete features %d (%.1f%%) | non-finite cells %.3f%%",
                           nm, nrow(m), ncol(m), sum(ok), 100 * sum(ok) / nrow(m),
                           100 * mean(!is.finite(m))))
            }

            f <- targets::tar_read(mofa_factors)
            emit("")
            emit("### MOFA FACTORS")
            emit("dim (samples x factors):", paste(dim(f), collapse = " x "))
            emit("factor names:", paste(colnames(f), collapse = ", "))

            v <- targets::tar_read(mofa_varexp)
            emit("")
            emit("### VARIANCE EXPLAINED PER VIEW PER FACTOR (%)")
            emit(paste(capture.output(print(round(as.matrix(v), 2))), collapse = "\n"))

            s <- targets::tar_read(subtypes_mofa)
            emit("")
            emit("### MOFA SUBTYPES (k =", K_SUBTYPES, ")")
            emit(paste(capture.output(print(table(s))), collapse = "\n"))

            sn <- targets::tar_read(snf_clusters)
            emit("")
            emit("### SNF CLUSTERS (sensitivity)")
            emit(paste(capture.output(print(table(sn))), collapse = "\n"))

            cc <- targets::tar_read(concordance)
            emit("")
            emit("### MOFA vs SNF CONCORDANCE (adjusted Rand index)")
            emit(paste(capture.output(print(cc)), collapse = "\n"))

            ma <- targets::tar_read(mutation_factor_annot)
            emit("")
            emit("### FACTOR <-> DRIVER-MUTATION ASSOCIATION (mutation as external label)")
            emit(paste(capture.output(print(ma)), collapse = "\n"))

            # --- Module 4, the ONLY place its targets are ever built --------
            # Load survival/glmnet FIRST. Reading a coxph object back out of the
            # targets store does NOT load the package that defines its methods,
            # so `summary(cf$model)` fell through to summary.default and returned
            # an atomic vector -- run 31218159514 died on
            # `$ operator is invalid for atomic vectors` AFTER the pipeline had
            # built cleanly. Same class of bug as the masked predict(): a method
            # that exists is not a method that is reachable.
            suppressPackageStartupMessages({
              library(survival)
              library(glmnet)
            })
            # Without this block the survival fits and the BAP1 AUROC were
            # merely constructed and thrown away: nothing printed them and
            # nothing asserted them, so a degenerate fit left no trace. The
            # numbers are RECORDED here and ASSERTED by the ANCHOR tests in
            # the LEVEL-3 step. Nothing here selects or tunes anything.
            sdf <- targets::tar_read(survival_df)
            emit("")
            emit("### MODULE 4 SURVIVAL FRAME")
            emit(sprintf("rows %d | OS events %d (%.1f%%) | predictors: %s",
                         nrow(sdf), sum(sdf$status == 1L),
                         100 * mean(sdf$status == 1L),
                         paste(targets::tar_read(survival_predictors),
                               collapse = ", ")))
            emit(paste(capture.output(print(table(sdf$platform))), collapse = "\n"))

            cf <- targets::tar_read(cox_fit)
            emit("")
            emit("### COX FIT (EPV cap measured on the TRAINING rows)")
            emit(sprintf("train %d / test %d | training events %d | max predictors %d",
                         nrow(cf$train), nrow(cf$test),
                         cf$n_events, cf$max_predictors))
            emit(paste(capture.output(print(summary(cf$model)$coefficients)),
                       collapse = "\n"))

            m <- targets::tar_read(survival_metrics)
            emit("")
            emit("### HELD-OUT C-INDEX PER ARM (higher risk = worse prognosis)")
            emit(sprintf("cox %.4f | penalised %.4f | rsf %.4f",
                         m$cindex$cox, m$cindex$penalised, m$cindex$rsf))
            emit(sprintf("cox optimism (apparent - held-out) = %.4f",
                         m$optimism$cox))
            emit("")
            emit("### 5-YEAR CALIBRATION (Cox, held-out)")
            emit(paste(capture.output(print(m$calibration)), collapse = "\n"))

            b <- targets::tar_read(bap1_auroc)
            emit("")
            emit("### BAP1-FROM-EXPRESSION AUROC (external label, non-circular)")
            emit(paste(capture.output(print(unlist(
              b[c("cv_auroc", "heldout_auroc", "n_samples", "n_bap1_mutant")]
            ))), collapse = "\n"))
            close(out)
          '

      # LEVEL 3 — the credibility anchors, against the store that LEVEL 2 just
      # built. This is the ONLY place they execute: they read frozen targets, so
      # a skip here would mean the anchor "never runs anywhere" — it skips
      # locally by design and would skip in the container by accident.
      # Deliberately NOT continue-on-error: a red anchor on real data is the
      # finding this phase exists to surface.
      #
      # ALL THREE FILES, not just test-sanity.R. The ANCHOR blocks in
      # test-clinical.R — including the measured 214/310 split and the
      # no-NA-platform-inside-the-cohort property that Phase 4's adjustment
      # actually depends on — used to run NOWHERE: LEVEL 1 explicitly tolerates
      # anchor skips (no store yet) and gates only on non-anchor skips, and this
      # step re-ran a single file, so its zero-skip gate covered test-sanity.R
      # alone. That is precisely the failure mode the paragraph above says this
      # step exists to prevent. test-survival.R joins them for the same reason:
      # its four Module-4 anchors read survival_df / cox_fit / survival_metrics
      # / bap1_auroc, which exist nowhere else, and would otherwise skip in the
      # one place they can execute. `filter` matches the file stem, so this
      # selects test-sanity.R, test-clinical.R and test-survival.R and nothing
      # else — and the count below must be bumped whenever that list changes,
      # or a new anchor file silently never runs.
      - name: Credibility anchors against the real store (sanity + clinical + survival)
        run: |
          R -q -e '
            source("R/constants.R")
            res <- testthat::test_dir("tests/testthat", filter = "sanity|clinical|survival",
                                      reporter = "summary", stop_on_failure = FALSE)
            df  <- as.data.frame(res)
            stopifnot(length(unique(df$file)) == 3L)
            anchor <- grepl("^ANCHOR:", df$test)
            cat("\n### CREDIBILITY ANCHORS (sanity + clinical + survival)\n")
            cat("anchors :", sum(anchor), "\n")
            for (f in sort(unique(df$file))) {
              cat(sprintf("  %-18s anchors %d\n", f, sum(anchor & df$file == f)))
            }
            cat("passed  :", sum(df$passed[anchor]), "\n")
            cat("failed  :", sum(df$failed[anchor]), "\n")
            cat("skipped :", sum(df$skipped[anchor]), "\n")
            sr <- targets::tar_read(sanity_results)
            cat("\n### SANITY VERDICTS ON REAL DATA\n")
            for (nm in names(sr)) {
              cat(sprintf("%-15s pass = %s | %s\n", nm, sr[[nm]]$pass, sr[[nm]]$label))
            }
            cat("\n### mutation frequencies vs published ranges\n")
            print(sr$mutation_freq$per_gene)
            cat("\n### BAP1 survival (+ the design adequacy of the fit)\n")
            print(sr$bap1_survival[c("hr", "ci_low", "ci_high", "p_value", "n",
                                     "n_events", "n_mutant", "n_events_mutant",
                                     "mutant_frac", "events_required",
                                     "underpowered")])
            cat("\n### methylation strata\n")
            print(sr$methyl_strata[c("n_strata", "n_cpg_used", "silhouette",
                                     "kw_p_value", "platform_ari", "platform_p",
                                     "merged_exceeds_within")])
            cat("\n### methylation strata WITHIN each assay platform\n")
            print(sr$methyl_strata$within_platform)
            cat("\n### the m1-m4 verdict, in words\n")
            cat(sr$methyl_strata$message, "\n")
            cat("\n### EACH MOFA FACTOR vs PLATFORM (the predictor-selection basis)\n")
            fp <- targets::tar_read(factor_platform)
            print(fp[order(-fp$auc), ])
            cat("wired predictors:", paste(PLATFORM_CLEAN_MOFA_FACTORS, collapse = ", "),
                "| their BH q:",
                paste(signif(fp$q_value[match(PLATFORM_CLEAN_MOFA_FACTORS, fp$factor)], 3),
                      collapse = ", "), "\n")

            cat("\n### CASES ASSAYED ON BOTH METHYLATION PLATFORMS\n")
            cat("methyl_platform_overlap =",
                targets::tar_read(methyl_platform_overlap), "\n")
            cat("(the count the no-batch-correction decision rests on; it was",
                "stated in six places and recorded in none until now)\n")
            cat("\n### MOFA subtypes vs assay platform (the clean result)\n")
            print(sr$subtype_platform[c("ari", "p_value", "n", "n_subtypes")])
            print(sr$subtype_platform$cross_tab)
            cat("\n### ccA/ccB signature\n")
            print(sr$ccab_signature[c("silhouette", "separation_p_value",
                                      "anticorr_rho", "anticorr_p_value",
                                      "n_ccb_used", "n_cca_used")])
            if (sum(df$skipped[anchor]) > 0) {
              print(df[anchor & df$skipped > 0, c("file", "test")])
              stop("credibility anchors SKIPPED after tar_make — they must execute here")
            }

            # EXPECTED FAILURES. The m1-m4 anchors are a RECORDED NEGATIVE
            # RESULT: on this snapshot the merged methylation partition tracks
            # assay platform (ARI 0.583) and the strata do not survive within a
            # single arm. Letting the job stay permanently red would train
            # everyone to ignore it, and silencing the anchor would delete the
            # finding. So the set of failures is pinned instead: exactly these
            # two may fail. A NEW red anchor fails the job; an m1-m4 anchor that
            # starts PASSING also fails the job, because that means the data or
            # the pipeline changed and the recorded negative no longer holds.
            expected_red <- c(
              "ANCHOR: methylation recovers four strata (m1-m4) -- RED, a real negative result",
              "ANCHOR: the m1-m4 strata are biology, not the HM27/HM450 batch -- RED"
            )
            red <- sort(df$test[df$failed > 0])
            missing_red <- setdiff(expected_red, red)
            unexpected_red <- setdiff(red, expected_red)
            cat("\n### EXPECTED-FAILURE LEDGER\n")
            cat("expected red :", length(expected_red), "\n")
            cat("observed red :", length(red), "\n")
            if (length(unexpected_red)) {
              cat("\nUNEXPECTED failures (these fail the job):\n")
              cat(paste0("  - ", unexpected_red, collapse = "\n"), "\n")
            }
            if (length(missing_red)) {
              cat("\nExpected-red anchors that PASSED (the recorded negative no",
                  "longer holds -- re-verify and update the ledger):\n")
              cat(paste0("  - ", missing_red, collapse = "\n"), "\n")
            }
            if (length(unexpected_red) || length(missing_red)) quit(status = 1)
            cat("\nLedger matches: the only red anchors are the recorded m1-m4",
                "negative result.\n")
          '

      - name: Collect targets metadata
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts
          cp -r _targets/meta artifacts/targets-meta 2>/dev/null || echo "no _targets/meta"
          du -sh _targets 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module2-results
          path: artifacts/
          if-no-files-found: warn
