name: ci

# Scope (design spec section 8): CI lints and runs the unit tests on subsampled
# fixtures. It does NOT run the pipeline and does NOT rebuild the full research
# environment — a green badge here is not full reproduction.
#
# Why not `renv::restore()` of the whole lockfile: renv.lock pins the complete
# 218-package RESEARCH environment (MOFA2, minfi, curatedTCGAData, scanpy...).
# Restoring it for a lint-and-fixture-test job is both disproportionate and
# fragile — on a bare ubuntu runner it fails outright, e.g.
#   error testing if 'igraph' can be loaded
#   libglpk.so.40: cannot open shared object file
# because the Bioconductor dependency chain needs system libraries that image
# does not carry. Instead this job runs inside the SAME Bioconductor image the
# Dockerfile builds on (so system libraries are guaranteed and CI matches
# production), installs only what the tests import, and then ASSERTS those
# versions equal renv.lock so CI still guards the pins it depends on.
#
# Full-lockfile restore is exercised where it belongs: the Dockerfile's
# renv::restore(). NOTE: heavy-pull.yml does NOT restore the lockfile -- it
# GENERATES it (see its "Generate complete renv.lock from the installed
# library" step). No workflow currently restores renv.lock; only the Docker
# image build does.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  r-checks:
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_23
    defaults:
      run:
        shell: bash
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      HEAVY_PULL: "false"
      # The repo .Rprofile activates renv and repoints libPaths at an empty
      # project library, which would hide everything installed below.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      R_PROFILE_USER: /dev/null
    steps:
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          set -euxo pipefail
          R -q -e '
            # SNFtool is NOT in the Bioconductor base image and Module 2s
            # fn_run_snf tests call it directly, so without it
            # tests/testthat.R errors with "there is no package called
            # SNFtool". The SAME is now true of Module 4s fitters: five tests
            # in test-survival.R call glmnet::cv.glmnet and
            # randomForestSRC::rfsrc/predict.rfsrc with NO skip guard -- by
            # design, because a skip that never lifts is a defect here -- and
            # neither package ships in this image, which is exactly why
            # heavy-pull.yml installs glmnet/randomForestSRC/survival
            # explicitly. tests/testthat.R runs test_dir(stop_on_failure =
            # TRUE), so omitting them makes this job red on every push.
            # MOFA2/mofapy2 are deliberately absent: those tests
            # guard on skip_if_no_mofapy2() and run in verify-module2.yml.
            pkgs <- c("testthat", "lintr", "targets", "yaml", "SNFtool",
                      "glmnet", "randomForestSRC", "survival",
                      "MultiAssayExperiment", "SummarizedExperiment",
                      "RaggedExperiment")
            BiocManager::install(pkgs, update = FALSE, ask = FALSE, Ncpus = 4)
            missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("failed to install: ", paste(missing, collapse = ", "))
          '

      # Keeps this job honest about the lockfile it deliberately does not restore.
      - name: Assert installed versions match renv.lock
        run: |
          R -q -e '
            lock <- jsonlite::fromJSON("renv.lock")$Packages
            check <- c("MultiAssayExperiment", "SummarizedExperiment",
                       "RaggedExperiment", "targets", "SNFtool")
            bad <- character(0)
            for (p in check) {
              want <- lock[[p]]$Version
              got  <- as.character(packageVersion(p))
              cat(sprintf("%-24s lock=%-10s installed=%-10s %s\n",
                          p, want, got, if (identical(want, got)) "OK" else "MISMATCH"))
              if (!identical(want, got)) bad <- c(bad, p)
            }
            if (length(bad)) {
              stop("installed versions drifted from renv.lock: ", paste(bad, collapse = ", "))
            }
          '

      # Lint rules live in .lintr (single source of truth, shared with local runs).
      # object_usage_linter is disabled there: this is a targets/source() project,
      # not a package, so constants in R/constants.R and helpers in
      # R/functions_utils.R are invisible to per-file static analysis and every
      # cross-file reference would be a false positive.
      - name: Lint R (config from .lintr)
        run: |
          R -q -e 'l <- lintr::lint_dir("R");
            if (length(l) > 0) { print(l); quit(status = 1) }'

      - name: Run testthat on fixtures (no full pipeline)
        run: Rscript tests/testthat.R

  # Nothing on push or PR proved the five .qmd pages still RENDER. pages.yml is
  # the only file that renders and it is workflow_dispatch-only; cron.yml
  # deliberately does not dispatch it; verify-module2.yml does not render. So a
  # broken page was discovered at manual publish time, which is how a defect
  # that aborts the whole render on the store-present path sat undetected in
  # dashboard.qmd (facet_wrap over an empty driver-gene selection).
  #
  # This job renders BOTH branches, because they are different code paths and
  # only one of them is reachable without a store:
  #   1. no store  -> every page must degrade to stated gaps;
  #   2. fixture store -> every page must render its figures, with NO gaps left.
  #
  # It is a SEPARATE job on purpose. `tests/testthat.R` refuses to skip the
  # store-backed literature anchors against a populated store (by design -- a
  # skip that never lifts is a defect), so a fixture store sitting in the
  # workspace during the r-checks job would make 7 real-data anchors ERROR
  # against synthetic values. Different job, different workspace, no ordering
  # hazard.
  #
  # This does NOT restore the release asset and it is NOT reproduction: the
  # fixture store holds invented stand-ins, and nothing rendered here is
  # published. Its whole job is that the pages execute.
  render-smoke:
    runs-on: ubuntu-latest
    env:
      HEAVY_PULL: "false"
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      R_PROFILE_USER: /dev/null
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      # Deliberately the SAME list as pages.yml, including `rmarkdown` (the
      # knitr engine's own dependency, not a page's). Keeping them identical is
      # what makes this job a smoke test of the Pages package list too -- a
      # missing entry there used to surface only on a manual dispatch, after
      # the release-asset download had already succeeded.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::targets
            any::plotly
            any::ggplot2
            any::survival
            any::knitr
            any::rmarkdown
            any::htmltools
            any::httr

      - name: Render all five pages with NO store (the degradation branch)
        run: |
          set -euxo pipefail
          test ! -f _targets/meta/meta
          quarto render dashboard
          for p in index dashboard factors survival live-gdc; do
            test -f "_site/$p.html"
            # Without the store every page MUST show stated gaps. Zero gaps here
            # would mean a card silently rendered something it had no data for.
            grep -q 'class="pending-note' "_site/$p.html"
          done

      - name: Render again against a fixture store (the store-present branch)
        run: |
          set -euxo pipefail
          Rscript -e 'targets::tar_make(script = "scripts/fixture_store_pipeline.R", store = "_targets")'
          rm -rf _site
          quarto render dashboard
          for p in index dashboard factors survival live-gdc; do
            test -f "_site/$p.html"
            # With every target available NOTHING may still be pending: a gap
            # here is a page failing to read a target the store holds.
            if grep -q 'class="pending-note' "_site/$p.html"; then
              echo "::error::$p.html still shows a stated gap with a full store"
              exit 1
            fi
          done

      # The fixture store holds invented values. It must not survive the job,
      # be cached, or be mistaken for a restored release asset.
      - name: Delete the fixture store
        if: always()
        run: rm -rf _targets/meta _targets/objects _targets/user _site

  py-checks:
    runs-on: ubuntu-latest
    env:
      HEAVY_PULL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy + pandas + scikit-learn: Module 4's BAP1-classifier tests
      # (tests/pytest/test_bap1_classifier.py) import all three and fail
      # COLLECTION without them, so "numpy only" stopped being true when Task
      # 4.8 landed. Versions match requirements.txt so CI and the research
      # container score the classifier with the same solver. The genuinely
      # heavy parts of requirements.txt (mofapy2, scanpy) stay out — they are
      # the research environment and are installed in the Docker image and the
      # heavy-pull job only.
      - name: Install tooling
        run: >
          pip install ruff pytest "numpy==1.26.4" "pandas==2.2.2"
          "scikit-learn==1.5.1"
      # `ruff check .` rather than naming directories: excludes live in
      # pyproject.toml. (`python/` did not exist until Module 4 created it, and
      # naming a not-yet-existing path made ruff exit 1 with
      # "E902 No such file or directory --> python:1:1".)
      - name: Lint Python
        run: ruff check .
      - name: Run pytest on fixtures (skip heavy paths)
        run: pytest tests/pytest -q -m 'not heavy'
